<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetVigil</title>
    <base href="/" />

    <!-- Стандартные стили Blazor -->
    <link href="css/app.css" rel="stylesheet" />
    <link href="NetVigil.Client.styles.css" rel="stylesheet" />

    <style>
        :root {
            --bg-dark: #0b1120;
            --bg-card: #1e293b;
            --bg-sidebar: #111827;
            --bg-input: #0b1120;
            --bg-table-row: #162032;
            --bg-table-hover: #1f2d42;
            --bg-app-loading: #0b1120;
            --main-bg: radial-gradient(circle at top right, #1e293b 0%, #0b1120 40%);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-green-glow: rgba(16, 185, 129, 0.2);
            --accent-blue: #3b82f6;
            --border-color: #334155;
            --grid-stroke: #334155;
            --hover-bg: rgba(255, 255, 255, 0.05);
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --card-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        /* Light theme — keep accents, swap surfaces and text. */
        html.light-mode,
        body.light-mode {
            --bg-dark: #eef2f7;
            --bg-card: #ffffff;
            --bg-sidebar: #ffffff;
            --bg-input: #f8fafc;
            --bg-table-row: #ffffff;
            --bg-table-hover: #f1f5f9;
            --bg-app-loading: #f8fafc;
            --main-bg: radial-gradient(circle at top right, #e0e7ff 0%, #f8fafc 50%);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #d1d9e6;
            --grid-stroke: #cbd5e1;
            --hover-bg: rgba(15, 23, 42, 0.04);
            --card-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
            --card-shadow-hover: 0 6px 16px -4px rgba(15, 23, 42, 0.12);
        }

        html, body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .page {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background: var(--main-bg);
            color: var(--text-primary);
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

            .card:hover {
                border-color: var(--text-secondary);
                box-shadow: var(--card-shadow-hover);
            }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        th {
            text-align: left;
            color: var(--text-secondary);
            padding: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 16px 12px;
            background: var(--bg-table-row);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        tr td:first-child {
            border-left: 1px solid var(--border-color);
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        tr td:last-child {
            border-right: 1px solid var(--border-color);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        tr:hover td {
            background: var(--bg-table-hover);
        }

        .btn-primary {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

            .btn-primary:hover {
                background: var(--accent-green-hover);
                box-shadow: 0 0 15px var(--accent-green-glow);
                transform: translateY(-1px);
            }

        .status-badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-online {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .status-offline {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-secondary);
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        #app-loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-app-loading);
            color: var(--accent-green);
            font-family: monospace;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    </style>
</head>

<body>
    <!-- ВОТ ЭТОГО СКОРЕЕ ВСЕГО НЕ БЫЛО -->
    <div id="app">
        <div id="app-loading">
            Loading NetVigil System...
        </div>
    </div>

    <!-- И ВОТ ЭТОГО СКРИПТА НЕ БЫЛО - ОН ЗАПУСКАЕТ BLAZOR -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
